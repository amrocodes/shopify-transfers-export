name: Shopify Transfers Export

on:
  # Runs every day at 02:00 UTC (11:00 JST)
  schedule:
    - cron: "0 2 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  run-export:
    runs-on: ubuntu-latest

    env:
      # Shopify (from GitHub Secrets)
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_API_VERSION: "2025-10"

      # Google Sheets (from GitHub Secrets)
      GSPREAD_SHEET_ID: ${{ secrets.GSPREAD_SHEET_ID }}

      # Service account JSON will be written to this path
      GOOGLE_SERVICE_ACCOUNT_JSON_PATH: ${{ github.workspace }}/service_account.json
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas gspread google-auth google-auth-oauthlib google-api-python-client python-dotenv requests python-dateutil xlsxwriter
          fi

      - name: Write Google service account JSON
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi

          # Write the JSON from the secret directly to a file (no base64)
          printf '%s\n' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_SERVICE_ACCOUNT_JSON_PATH"

          echo "Service account JSON written to: $GOOGLE_SERVICE_ACCOUNT_JSON_PATH"
          ls -l "$GOOGLE_SERVICE_ACCOUNT_JSON_PATH"

      - name: Run export script
        run: |
          python shopify_transfers_pretty_export.py
