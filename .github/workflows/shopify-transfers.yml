name: Shopify Transfers Export

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # Runs every hour. Adjust as needed.

jobs:
  run-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install xlsxwriter

      - name: Write service account credentials
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}" > service_account.json

      - name: Set environment variables
        run: |
          echo "SHOPIFY_SHOP_DOMAIN=${{ secrets.SHOPIFY_SHOP_DOMAIN }}" >> $GITHUB_ENV
          echo "SHOPIFY_ACCESS_TOKEN=${{ secrets.SHOPIFY_ACCESS_TOKEN }}" >> $GITHUB_ENV
          echo "SHOPIFY_API_VERSION=2025-10" >> $GITHUB_ENV

          echo "GSPREAD_SHEET_ID=${{ secrets.GSPREAD_SHEET_ID }}" >> $GITHUB_ENV

          # Point script to service account JSON
          echo "GOOGLE_OAUTH_CLIENT_JSON=$PWD/service_account.json" >> $GITHUB_ENV
          echo "GOOGLE_OAUTH_TOKEN_PKL=$PWD/token.pkl" >> $GITHUB_ENV

      - name: Run exporter
        run: |
          python shopify_transfers_pretty_export.py
