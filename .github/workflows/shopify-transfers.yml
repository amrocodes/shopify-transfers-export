name: Shopify Transfers Export

on:
  # Manual run button in GitHub UI
  workflow_dispatch:

  # Scheduled run – times are in UTC
  schedule:
    # 20:30 UTC = 5:30 JST (UTC+9) next day
    - cron: "30 20 * * *"

jobs:
  run-export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Shopify transfers export
        working-directory: scrapers
        env:
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          GSPREAD_SHEET_ID: ${{ secrets.GSPREAD_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python shopify_transfers_pretty_export.py
