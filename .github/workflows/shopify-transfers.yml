name: Shopify Transfers Export

on:
  schedule:
    # Run every day at 02:30 UTC (adjust as you like)
    - cron: "30 2 * * *"
  workflow_dispatch: {}

jobs:
  run-export:
    runs-on: ubuntu-latest

    env:
      # Shopify – from repo secrets
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_API_VERSION: "2025-10"

      # Google Sheets – from repo secrets
      GSPREAD_SHEET_ID: ${{ secrets.GSPREAD_SHEET_ID }}

      # We'll write the decoded JSON to this path:
      GOOGLE_SERVICE_ACCOUNT_JSON_PATH: "${{ github.workspace }}/service_account.json"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas gspread google-auth google-auth-oauthlib google-api-python-client python-dotenv requests python-dateutil xlsxwriter
          fi

      # 🔑 Decode the base64 service account JSON into a real file
      - name: Write Google service account JSON
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON_B64 secret is not set"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > "$GOOGLE_SERVICE_ACCOUNT_JSON_PATH"
          echo "Wrote service account JSON to $GOOGLE_SERVICE_ACCOUNT_JSON_PATH"

      - name: Run export script
        env:
          # Pass through env so your script can find them
          SHOPIFY_SHOP_DOMAIN: ${{ env.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ env.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_API_VERSION: ${{ env.SHOPIFY_API_VERSION }}

          GSPREAD_SHEET_ID: ${{ env.GSPREAD_SHEET_ID }}
          # Important: your script should read this path
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ env.GOOGLE_SERVICE_ACCOUNT_JSON_PATH }}

        run: |
          python shopify_transfers_pretty_export.py
