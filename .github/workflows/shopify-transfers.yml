name: Shopify Transfers Export

on:
  workflow_dispatch:        # manual run button
  schedule:
    # Every day at 20:30 UTC = 05:30 JST the next morning
    - cron: "30 20 * * *"

jobs:
  export:
    runs-on: ubuntu-latest

    env:
      # Shopify (set these as Actions secrets)
      SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_API_VERSION: "2025-10"

      # Google Sheets / Service Account (option 2 setup)
      GSPREAD_SHEET_ID: ${{ secrets.GSPREAD_SHEET_ID }}
      GOOGLE_OAUTH_CLIENT_JSON: "${{ github.workspace }}/gcp-client.json"
      GOOGLE_OAUTH_TOKEN_PKL: "${{ github.workspace }}/token.pkl"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google service account key
        # Secret GOOGLE_OAUTH_CLIENT_JSON should be the *full JSON* of your key
        run: |
          echo '${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}' > gcp-client.json

      - name: Run Shopify transfers export
        run: |
          python scrapers/shopify_transfers_pretty_export.py
