name: Run Shopify Transfers Export

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 20 * * *'   # runs daily at 20:30 UTC (05:30 JST)

jobs:
  run-export:
    runs-on: ubuntu-latest

    steps:
      # Pull your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Set up environment variables for the script
      - name: Export environment variables
        run: |
          echo "SHOPIFY_SHOP_DOMAIN=${{ secrets.SHOPIFY_SHOP_DOMAIN }}" >> $GITHUB_ENV
          echo "SHOPIFY_ACCESS_TOKEN=${{ secrets.SHOPIFY_ACCESS_TOKEN }}" >> $GITHUB_ENV
          echo "SHOPIFY_API_VERSION=2025-10" >> $GITHUB_ENV
          echo "GSPREAD_SHEET_ID=${{ secrets.GSPREAD_SHEET_ID }}" >> $GITHUB_ENV
          echo "GOOGLE_OAUTH_CLIENT_JSON=client_secret.json" >> $GITHUB_ENV
          echo "GOOGLE_OAUTH_TOKEN_PKL=token.pkl" >> $GITHUB_ENV

      # Create Google OAuth credential file
      - name: Write Google credentials file
        run: |
          echo "${{ secrets.GOOGLE_OAUTH_JSON }}" > client_secret.json

      # Run your Python script (located in repo root)
      - name: Run transfer export script
        run: python shopify_transfers_pretty_export.py
